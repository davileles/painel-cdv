name: Resumo Diário — Ofertas e Emissões (20h)

on:
  schedule:
    - cron: '0 21 * * 1-5'  # 21:00 UTC seg-sex = 18:00 SP; folga p/ atraso do Actions antes do agendamento das 20h SP
  workflow_dispatch: {}     # permite rodar manualmente pela aba Actions

permissions:
  contents: read

jobs:
  resumo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Montar e agendar resumos do dia
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node resumo-diario.js
