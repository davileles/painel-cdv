name: Radar de Ofertas — Coleta e Reescrita com IA

on:
  schedule:
    - cron: '0 */3 * * *'   # a cada 3 horas
  workflow_dispatch: {}      # permite rodar manualmente pela aba Actions

# Serializa execucoes deste workflow: duas rodadas simultaneas gravando o
# mesmo JSON via API produzem lost update (a segunda sobrescreve a primeira).
concurrency:
  group: radar-ofertas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar coletor do Radar de Ofertas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node coletar-radar.js

      # Mesmo tratamento do coletar-historico.yml: ofertas-pendentes.json é
      # escrito também pelo proxy (aprovar/rejeitar), então `pull --rebase`
      # conflitava e jogava fora a coleta inteira. reconciliar-estado.js une
      # as listas por id e a de IDs processados por conjunto.
      - name: Commit arquivos atualizados
        run: |
          set -euo pipefail
          ARQS="ofertas-pendentes.json ofertas-processados.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/coleta
          for f in $ARQS; do [ -f "$f" ] && cp "$f" /tmp/coleta/ || true; done

          for tent in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node reconciliar-estado.js /tmp/coleta
            for f in $ARQS; do [ -f "$f" ] && git add "$f" || true; done
            if git diff --staged --quiet; then
              echo "Nada mudou em relação ao remoto — nada a commitar."
              exit 0
            fi
            git commit -m "chore: atualiza radar e histórico de IDs [skip ci]"
            if git push; then
              echo "✓ Radar salvo na tentativa $tent."
              exit 0
            fi
            echo "Push rejeitado (remoto mudou durante o commit). Nova tentativa em ${tent}0s..."
            sleep "${tent}0"
          done
          echo "::error::Não consegui salvar o radar após 5 tentativas."
          exit 1
