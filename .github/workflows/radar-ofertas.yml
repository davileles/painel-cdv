name: Radar de Ofertas — Coleta e Reescrita com IA

on:
  schedule:
    - cron: '0 */3 * * *'   # a cada 3 horas
  workflow_dispatch: {}      # permite rodar manualmente pela aba Actions

# Serializa execucoes deste workflow: duas rodadas simultaneas gravando o
# mesmo JSON via API produzem lost update (a segunda sobrescreve a primeira).
concurrency:
  group: radar-ofertas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar coletor do Radar de Ofertas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node coletar-radar.js

      - name: Commit arquivos atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ofertas-pendentes.json ofertas-processados.json
          git diff --staged --quiet || git commit -m "chore: atualiza radar e histórico de IDs [skip ci]"
          git pull --rebase origin main
          git push
