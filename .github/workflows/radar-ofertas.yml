name: Radar de Ofertas — Coleta e Reescrita com IA

on:
  schedule:
    - cron: '0 */3 * * *'   # a cada 3 horas
  workflow_dispatch: {}      # permite rodar manualmente pela aba Actions

# Serializa execucoes deste workflow: duas rodadas simultaneas gravando o
# mesmo JSON via API produzem lost update (a segunda sobrescreve a primeira).
concurrency:
  group: radar-ofertas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      CDV_DADOS_DIR: ${{ github.workspace }}/_dados/painel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Conteúdo pago (histórico, ofertas, passagens, alertas) mora no repo
      # PRIVADO de dados desde out/2026 — o painel-cdv é público.
      - name: Checkout dos dados (repo privado)
        uses: actions/checkout@v4
        with:
          repository: davileles/dados
          token: ${{ secrets.CDV_DADOS_TOKEN }}
          path: _dados
          sparse-checkout: painel
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar coletor do Radar de Ofertas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node coletar-radar.js

      # Mesmo tratamento do coletar-historico.yml: ofertas-pendentes.json é
      # escrito também pelo proxy (aprovar/rejeitar), então `pull --rebase`
      # conflitava e jogava fora a coleta inteira. reconciliar-estado.js une
      # as listas por id e a de IDs processados por conjunto.
      - name: Commit arquivos atualizados
        run: |
          set -euo pipefail
          ARQS="ofertas-pendentes.json ofertas-processados.json"
          mkdir -p /tmp/coleta
          for f in $ARQS; do [ -f "$CDV_DADOS_DIR/$f" ] && cp "$CDV_DADOS_DIR/$f" /tmp/coleta/ || true; done
          bash scripts/salvar-estado.sh "$GITHUB_WORKSPACE/_dados" painel /tmp/coleta "$ARQS" "chore: atualiza radar e histórico de IDs"
