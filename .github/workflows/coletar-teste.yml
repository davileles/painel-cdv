name: Teste coleta direta Livelo + Esfera
on:
  workflow_dispatch:
jobs:
  coletar-teste:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Executar coleta de teste
        run: node coletar-teste.js
      - name: Salvar historico-teste.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico-teste.json
          git diff --staged --quiet || git commit -m "chore: resultado coletar-teste $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
