name: Coletar histórico de pontuações
on:
  schedule:
    - cron: '0 9-23 * * *'   # de hora em hora, das 06h às 20h (horário de Brasília / UTC-3)
  workflow_dispatch:
jobs:
  coletar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Coletar pontuações Comparemania e disparar alertas
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node coletar.js
      - name: Coletar cashbacks Inter Gift Cards
        run: node coletar-inter.js
      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico.json alertas.json variacoes-notificadas.json ofertas-pendentes.json ofertas.json
          git diff --staged --quiet || git commit -m "chore: atualiza histórico $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
