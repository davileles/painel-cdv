name: Coletar histórico de pontuações
on:
  schedule:
    # FALLBACK apenas. A cadência de hora em hora (06h-20h SP) passou a ser
    # disparada pelo baileys-server no Railway, via workflow_dispatch
    # (agenda-actions.js) — o cron do Actions degradou nesta conta: de 15
    # disparos/dia até 25/08 para 2-5/dia em horários aleatórios (22h, 00h,
    # 01h SP) a partir de 26/08. Estas 5 âncoras cobrem o caso de o Railway
    # estar fora do ar; o disparo do Railway checa se já houve run nos últimos
    # 40 min antes de disparar, então as duas fontes não se atropelam.
    - cron: '0 9-23/3 * * *'   # 06h, 09h, 12h, 15h e 18h (horário de Brasília / UTC-3)
  workflow_dispatch:

# Serializa execucoes deste workflow: duas rodadas simultaneas gravando o
# mesmo JSON via API produzem lost update (a segunda sobrescreve a primeira).
concurrency:
  group: coletar-historico
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Coletar pontuações Comparemania e disparar alertas
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node coletar.js
      - name: Coletar cashbacks Inter Gift Cards
        run: node coletar-inter.js
      # Méliuz e TopCashback são scraping pesado — rodam 2x/dia, nas janelas de
      # 09h e 18h UTC. Janela tolerante (09–12h e 18–21h) porque o cron do GitHub
      # atrasa e a run "das 09h" costuma começar depois das 10h — antes disso a
      # checagem exata de hora fazia a coleta ser pulada. O arquivo de estado
      # cashback-intl-estado.txt (YYYY-MM-DD-janela) garante 1 execução por janela.
      # continue-on-error garante que uma falha aqui nunca derruba o commit da
      # coleta Comparemania/Inter feita acima.
      - name: Coletar cashbacks Méliuz e TopCashback (UK e US)
        continue-on-error: true
        run: |
          HORA=$(date -u +'%H')
          HOJE=$(date -u +'%Y-%m-%d')
          JANELA=""
          if [ "$HORA" -ge 9 ] && [ "$HORA" -le 12 ]; then JANELA="09"; fi
          if [ "$HORA" -ge 18 ] && [ "$HORA" -le 21 ]; then JANELA="18"; fi
          MARCA="$HOJE-$JANELA"
          ULTIMA=$(cat cashback-intl-estado.txt 2>/dev/null || echo "")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ -n "$JANELA" ] && [ "$MARCA" != "$ULTIMA" ]; }; then
            node coletar-meliuz.js
            node coletar-topcashback.js
            echo "$MARCA" > cashback-intl-estado.txt
          else
            echo "Fora da janela do Méliuz/TopCashback ou janela já coletada ($ULTIMA) — pulando."
          fi
      # ANTES: `git pull --rebase` e, no primeiro conflito, rebase abortado +
      # exit 1 — o commit da coleta era DESCARTADO. Aconteceu 2x em 01/09
      # (11h01 e 15h15): coletores rodaram, pontuações extraídas, nada salvo.
      # O conflito era sempre em ofertas.json, escrito também pelo proxy
      # (aprovar/rejeitar oferta no gerador) enquanto o job rodava.
      # AGORA: guarda o resultado fora da árvore, leva a árvore para o remoto
      # atual e reaplica com reconciliar-estado.js, que une as listas de
      # ofertas por id (respeitando rejeições e aprovações feitas no meio).
      # Conflito deixa de ser possível; push rejeitado só refaz o ciclo.
      - name: Salvar arquivos
        run: |
          set -euo pipefail
          ARQS="historico.json alertas.json variacoes-notificadas.json ofertas-pendentes.json ofertas.json meliuz-lojas.json topcashback-lojas.json cashback-intl-estado.txt validades-livelo.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/coleta
          for f in $ARQS; do [ -f "$f" ] && cp "$f" /tmp/coleta/ || true; done

          for tent in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node reconciliar-estado.js /tmp/coleta
            for f in $ARQS; do [ -f "$f" ] && git add "$f" || true; done
            if git diff --staged --quiet; then
              echo "Nada mudou em relação ao remoto — nada a commitar."
              exit 0
            fi
            git commit -m "chore: atualiza histórico $(date -u +'%Y-%m-%d %H:%M')"
            if git push; then
              echo "✓ Coleta salva na tentativa $tent."
              exit 0
            fi
            echo "Push rejeitado (remoto mudou durante o commit). Nova tentativa em ${tent}0s..."
            sleep "${tent}0"
          done
          echo "::error::Não consegui salvar a coleta após 5 tentativas."
          exit 1
