name: Disparar mensagens automáticas do Concierge

on:
  # ⏸️ MIGRADO para davileles/concierge — ver .github/workflows/disparar-msgs-concierge.yml lá.
  # Gatilho schedule removido aqui para evitar envio duplicado durante a transição.
  # Mantido workflow_dispatch como fallback manual caso a migração precise ser revertida.
  workflow_dispatch:        # permite rodar manualmente pelo GitHub

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Disparar mensagens programadas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node disparar-msgs-concierge.js
