# Valida sintaxe JS de index.html e index.js antes de mergear
# Roda em: push para qualquer branch + PRs para main
name: Validar JS

on:
  push:
    paths:
      - 'index.html'
      - 'index.js'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'index.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sintaxe — index.js
        run: node --check index.js

      - name: Extrair e verificar sintaxe — index.html
        run: |
          node - << 'JSEOF'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const blocks = [...html.matchAll(/<script(?!\s+src)[^>]*>([\s\S]*?)<\/script>/g)]
            .map(m => m[1]);
          if (blocks.length === 0) {
            console.log('Nenhum bloco <script> inline encontrado — OK');
            process.exit(0);
          }
          const combined = blocks.join('\n');
          fs.writeFileSync('/tmp/_check_html.js', combined);
          const { execSync } = require('child_process');
          try {
            execSync('node --check /tmp/_check_html.js', { stdio: 'inherit' });
            console.log(`✅ ${blocks.length} bloco(s) <script> validado(s)`);
          } catch {
            console.error('❌ Erro de sintaxe JS em index.html');
            process.exit(1);
          }
          JSEOF

      - name: Checar constantes duplicadas de proxy
        run: |
          COUNT=$(grep -c "https://cdv-proxy-production.up.railway.app'" index.html || true)
          if [ "$COUNT" -gt "1" ]; then
            echo "⚠️  Atenção: $COUNT ocorrências de URL do proxy hardcoded em index.html (use _BASE)"
          else
            echo "✅ Constante de proxy centralizada — OK"
          fi
