<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mapa de Emissoes — Clube do Viajante</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#1e2535;--surface:#2a3246;--card:#323c54;--border:#3d4a66;
  --text:#eeeeee;--muted:#8a9bbf;--muted2:#5a6a8a;
  --accent:#ff585e;--accent2:#e04449;--green:#34d399;
  --latam:#dc2626;--smiles:#f97316;--azul:#0ea5e9;
  --livelo:#df0979;--esfera:#e8371b;--iberia:#c0392b;
  --tap:#005f9e;--flying:#003087;--aadvantage:#0068b2;--qatar:#8b0000;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;font-size:14px;min-height:100vh}

/* HEADER */
header{background:var(--surface);border-bottom:3px solid var(--accent);padding:14px 22px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:200}
.logo{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.logo span{color:var(--accent)}
header p{font-size:11px;color:var(--muted);margin-top:1px}

/* FILTROS */
.filtros{padding:12px 22px;border-bottom:1px solid var(--border);
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surface)}
.filtros input,.filtros select{
  background:var(--card);color:var(--text);
  border:1px solid var(--border);border-radius:8px;
  padding:7px 11px;font-size:12px;font-family:'Montserrat',sans-serif;outline:none;
  transition:border-color .2s}
.filtros input:focus,.filtros select:focus{border-color:var(--accent)}
.filtros input{width:130px}
#contador{font-size:11px;color:var(--muted2);margin-left:auto;font-weight:600}

/* MAPA */
#mapa-wrap{margin:20px 22px;border-radius:14px;border:1px solid var(--border);overflow:hidden;position:relative}
#mapa{height:500px;background:#131c2e}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;background:#131c2e;z-index:999;color:var(--muted);font-size:13px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* LEAFLET OVERRIDES */
.leaflet-tooltip{
  background:var(--surface)!important;border:1px solid var(--border)!important;
  color:var(--text)!important;border-radius:8px!important;font-size:12px!important;
  font-family:'Montserrat',sans-serif!important;padding:7px 11px!important;
  box-shadow:0 4px 20px rgba(0,0,0,.5)!important;font-weight:500!important}
.leaflet-tooltip::before{display:none!important}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9000;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:420px;max-height:90vh;overflow-y:auto;position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;
  color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:2px 6px;
  border-radius:6px;transition:background .15s}
.modal-close:hover{background:var(--card)}
.modal-flag{font-size:38px;padding:24px 24px 0;text-align:center}
.modal-dest{font-size:22px;font-weight:800;padding:8px 24px 4px;color:var(--text)}
.modal-sub{font-size:12px;color:var(--muted);padding:0 24px 16px;border-bottom:1px solid var(--border)}
.melhor-box{margin:16px 24px;background:var(--card);border-radius:12px;padding:14px 16px;
  border:1px solid var(--border)}
.melhor-label{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--accent);margin-bottom:4px;text-transform:uppercase}
.melhor-prog{font-size:18px;font-weight:800;color:var(--text)}
.melhor-pts{font-size:13px;color:var(--muted);margin-top:2px}
.prog-table{margin:0 24px 8px;width:calc(100% - 48px)}
.prog-table-header{display:grid;grid-template-columns:1fr auto auto;gap:8px;
  font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--muted2);
  text-transform:uppercase;padding:8px 0 6px;border-bottom:1px solid var(--border)}
.prog-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;
  align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.prog-row:last-child{border-bottom:none}
.prog-nome{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.prog-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.prog-pts{font-size:13px;font-weight:700;color:var(--text);text-align:right}
.prog-pts.eco{color:var(--green)}
.prog-pts.exec{color:var(--azul)}
.prog-pts.na{color:var(--muted2);font-weight:400}
.modal-oport{margin:0 24px 20px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);
  border-radius:12px;padding:12px 14px}
.oport-badge{display:inline-flex;align-items:center;gap:5px;background:var(--green);
  color:#0a1a12;font-size:10px;font-weight:800;border-radius:20px;padding:2px 8px;
  letter-spacing:.4px;margin-bottom:8px;text-transform:uppercase}
.oport-rota{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.oport-pts{font-size:20px;font-weight:800;color:var(--green)}
.oport-pts span{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Clube do <span>Viajante</span></div>
    <p>Mapa de Emissoes por Milhas</p>
  </div>
</header>

<div class="filtros">
  <input id="f-origem"  type="text" placeholder="Origem..." oninput="render()">
  <input id="f-destino" type="text" placeholder="Destino..." oninput="render()">
  <select id="f-prog" onchange="render()">
    <option value="">Todos os programas</option>
  </select>
  <select id="f-cabine" onchange="render()">
    <option value="">Todas as cabines</option>
    <option value="Executiva">Executiva</option>
    <option value="Economica">Economica</option>
  </select>
  <span id="contador"></span>
</div>

<div id="mapa-wrap">
  <div id="loading"><div class="spinner"></div>Carregando passagens...</div>
  <div id="mapa"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="fecharModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="fecharModal(null)">x</button>
    <div class="modal-flag" id="m-flag"></div>
    <div class="modal-dest" id="m-dest"></div>
    <div class="modal-sub" id="m-sub"></div>
    <div class="melhor-box" id="m-melhor" style="display:none">
      <div class="melhor-label">Melhor opcao</div>
      <div class="melhor-prog" id="m-melhor-prog"></div>
      <div class="melhor-pts" id="m-melhor-pts"></div>
    </div>
    <div class="prog-table" id="m-tabela" style="display:none">
      <div class="prog-table-header">
        <span>Programa</span>
        <span style="text-align:right">Econ.</span>
        <span style="text-align:right">Exec.</span>
      </div>
      <div id="m-linhas"></div>
    </div>
    <div class="modal-oport" id="m-oport" style="display:none">
      <div class="oport-badge">Ultima emissao encontrada</div>
      <div class="oport-rota" id="m-oport-rota"></div>
      <div class="oport-pts" id="m-oport-pts"></div>
    </div>
  </div>
</div>

function corProg(prog) {
  if (!prog) return PROG_CORES.default;

  for (const [k,v] of Object.entries(PROG_CORES)) {
    if (p.includes(k)) return v;

// Flags por pais/regiao (heuristico pelo nome do destino)

  if (d.includes('sydney')||d.includes('melbourne')) return '\uD83C\uDDE6\uD83C\uDDFA';

function norm(s) {
  return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
}
const IDX = {};
for (const [k,v] of Object.entries(COORDS)) IDX[norm(k)] = v;
function coords(nome) {
  if (!nome) return null;
  const n = norm(nome);
  if (IDX[n]) return IDX[n];
  for (const [k,v] of Object.entries(IDX)) {
    if (n.startsWith(k) || k.startsWith(n)) return v;
  }
  return null;
}

function fmtPts(n) {
  if (!n || n === Infinity) return null;
  if (n >= 1000) return Math.round(n/1000) + 'k';
  return String(n);
}

async function carregar() {
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 20000);
    const r = await fetch(PROXY + '/passagens/listar?t=' + Date.now(), { signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    passagens = (await r.json()).items || [];
    popularFiltros();
    iniciarMapa();
    render();
  } catch(e) {
    document.getElementById('loading').innerHTML =
      '<span style="color:#ff585e">Erro ao carregar: ' + e.message + '</span>';
  }
}

function popularFiltros() {
  const sel = document.getElementById('f-prog');
  const progs = [...new Set(passagens.map(p => p.programa).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Todos os programas</option>' +
    progs.map(p => '<option value="' + p + '">' + p + '</option>').join('');
}

function iniciarMapa() {
  mapa = L.map('mapa', {
    center: [15, 10], zoom: 2, minZoom: 2, maxZoom: 10, attributionControl: false
  });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19
  }).addTo(mapa);
  document.getElementById('loading').style.display = 'none';
}

function render() {
  if (!mapa) return;
  const fp = document.getElementById('f-prog').value.toLowerCase();
  const fc = document.getElementById('f-cabine').value.toLowerCase();
  const fo = norm(document.getElementById('f-origem').value);
  const fd = norm(document.getElementById('f-destino').value);

  let ps = passagens;
  if (fp) ps = ps.filter(p => (p.programa||'').toLowerCase() === fp);
  if (fc) ps = ps.filter(p => (p.cabine||'').toLowerCase().includes(fc));
  if (fo) ps = ps.filter(p => norm(p.origem).includes(fo));
  if (fd) ps = ps.filter(p => norm(p.destino).includes(fd));

  mapa.eachLayer(l => { if (l._cdv) mapa.removeLayer(l); });

  const grupos = {};
  for (const p of ps) {
    if (!p.destino) continue;
    if (!grupos[p.destino]) grupos[p.destino] = [];
    grupos[p.destino].push(p);
  }

  let nd = 0;
  for (const [dest, items] of Object.entries(grupos)) {
    const c = coords(dest);
    if (!c) continue;
    nd++;
    const qtd  = items.length;
    const prog = [...new Set(items.map(p => p.programa).filter(Boolean))][0];
    const raio = Math.min(36, Math.max(10, 10 + Math.sqrt(qtd) * 4));
    const cor  = corProg(prog);

    const mk = L.circleMarker(c, {
      radius: raio, fillColor: cor,
      color: 'rgba(255,255,255,.3)', weight: 1.5, opacity: 1, fillOpacity: .85
    });
    mk._cdv = true;

    const minPts = Math.min(...items.map(p => p.pontos||0).filter(v => v > 0));
    mk.bindTooltip(
      '<b style="font-size:13px">' + dest + '</b>' +
      '<br><span style="color:#8a9bbf">' + qtd + ' emissao' + (qtd>1?'es':'') + '</span>' +
      (minPts > 0 ? '<br><span style="color:#34d399;font-weight:700">' + minPts.toLocaleString('pt-BR') + ' pts min.</span>' : ''),
      { sticky: true }
    );

    mk.on('click', function() { abrirModal(dest, items); });
    mk.addTo(mapa);
  }

  document.getElementById('contador').textContent =
    nd + ' destino' + (nd!==1?'s':'') + '  |  ' +
    ps.length + ' emissao' + (ps.length!==1?'es':'');
}

function abrirModal(dest, items) {
  // Flag
  document.getElementById('m-flag').textContent = flagDestino(dest);
  document.getElementById('m-dest').textContent = dest;

  const total = items.length;
  const progs = [...new Set(items.map(p => p.programa).filter(Boolean))];
  document.getElementById('m-sub').textContent =
    total + ' emissao' + (total>1?'es':'') + ' registrada' + (total>1?'s':'') +
    '  |  ' + progs.length + ' programa' + (progs.length>1?'s':'');

  // Agrupar por programa — menor pts eco e exec
  const porProg = {};
  for (const p of items) {
    const prog = p.programa || 'Outros';
    if (!porProg[prog]) porProg[prog] = { eco: Infinity, exec: Infinity, ultimo: null };
    const pts = p.pontos || 0;
    if (!pts) continue;
    const cab = (p.cabine||'').toLowerCase();
    if (cab.includes('exec')) {
      if (pts < porProg[prog].exec) porProg[prog].exec = pts;
    } else {
      if (pts < porProg[prog].eco) porProg[prog].eco = pts;
    }
    if (!porProg[prog].ultimo || new Date(p.enviadoEm) > new Date(porProg[prog].ultimo.enviadoEm)) {
      porProg[prog].ultimo = p;
    }
  }

  // Ordenar por menor pts eco
  const sorted = Object.entries(porProg).sort((a,b) => {
    const pa = a[1].eco === Infinity ? a[1].exec : a[1].eco;
    const pb = b[1].eco === Infinity ? b[1].exec : b[1].eco;
    return pa - pb;
  });

  // Melhor opcao
  const [melhorProg, melhorDados] = sorted[0] || [null,null];
  const mbox = document.getElementById('m-melhor');
  if (melhorProg) {
    const minMelhor = melhorDados.eco !== Infinity ? melhorDados.eco : melhorDados.exec;
    document.getElementById('m-melhor-prog').textContent = melhorProg;
    document.getElementById('m-melhor-pts').textContent =
      'A partir de ' + minMelhor.toLocaleString('pt-BR') + ' pontos';
    document.getElementById('m-melhor-prog').style.color = corProg(melhorProg);
    mbox.style.display = 'block';
  } else {
    mbox.style.display = 'none';
  }

  // Tabela por programa
  const tabela = document.getElementById('m-tabela');
  const linhas = document.getElementById('m-linhas');
  if (sorted.length > 0) {
    linhas.innerHTML = sorted.map(([prog, d]) => {
      const eco  = fmtPts(d.eco);
      const exec = fmtPts(d.exec);
      return '<div class="prog-row">'
        + '<div class="prog-nome"><span class="prog-dot" style="background:' + corProg(prog) + '"></span>' + prog + '</div>'
        + '<div class="prog-pts eco">' + (eco  || '<span class="na">-</span>') + '</div>'
        + '<div class="prog-pts exec">' + (exec || '<span class="na">-</span>') + '</div>'
        + '</div>';
    }).join('');
    tabela.style.display = 'block';
  } else {
    tabela.style.display = 'none';
  }

  // Ultima emissao encontrada
  const oport = document.getElementById('m-oport');
  // Pegar a mais recente de todas
  const recente = items.filter(p => p.pontos > 0 && p.fonte !== 'alerta_rejeitado')
    .sort((a,b) => new Date(b.enviadoEm||0) - new Date(a.enviadoEm||0))[0];
  if (recente) {
    const quando = recente.enviadoEm ? tempoAtras(recente.enviadoEm) : '';
    document.getElementById('m-oport-rota').textContent =
      (recente.origem||'') + (recente.origem&&recente.destino ? ' > ' : '') + (recente.destino||'');
    document.getElementById('m-oport-pts').innerHTML =
      recente.pontos.toLocaleString('pt-BR') +
      ' <span>' + (recente.programa||'') + (quando ? '  |  ' + quando : '') + '</span>';
    oport.style.display = 'block';
    // Atualizar badge com tempo
    oport.querySelector('.oport-badge').textContent =
      'Ultima emissao' + (quando ? '  ' + quando : '');
  } else {
    oport.style.display = 'none';
  }

  document.getElementById('modal-overlay').classList.add('open');
}

function tempoAtras(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const h = Math.floor(diff / 3600000);
  const d = Math.floor(h / 24);
  if (d > 0) return 'ha ' + d + ' dia' + (d>1?'s':'');
  if (h > 0) return 'ha ' + h + 'h';
  return 'agora';
}

function fecharModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(null); });

carregar();
</script>
