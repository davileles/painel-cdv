<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Emissões — CDV</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0c12;color:#e2e8f0;font-family:'Inter',system-ui,sans-serif;min-height:100vh}
.header{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
.header h1{font-size:18px;font-weight:600;color:#fff}
.header span{font-size:13px;color:rgba(255,255,255,.4)}
.controls{padding:16px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid rgba(255,255,255,.06)}
.controls input,.controls select{
  background:rgba(255,255,255,.06);color:#e2e8f0;
  border:1px solid rgba(255,255,255,.12);border-radius:8px;
  padding:8px 12px;font-size:13px;outline:none;
  transition:border-color .2s
}
.controls input:focus,.controls select:focus{border-color:rgba(210,168,90,.6)}
.controls input{width:140px}
#contador{font-size:12px;color:rgba(255,255,255,.35);margin-left:auto}
#mapa-wrap{position:relative;margin:20px 24px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
#mapa{height:520px;background:#0d1117}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.4);font-size:14px;background:#0d1117;z-index:1000}
#painel-detalhe{display:none;margin:0 24px 24px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:18px}
#painel-titulo{font-weight:700;font-size:15px;margin-bottom:12px;color:#fff}
#painel-lista{display:flex;flex-direction:column;gap:8px}
.card-emissao{background:rgba(255,255,255,.05);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.card-emissao .cia{font-weight:700;font-size:13px}
.card-emissao .rota{font-size:12px;color:rgba(255,255,255,.45)}
.card-emissao .meta{font-size:12px;color:rgba(255,255,255,.65)}
.card-emissao .datas{font-size:11px;color:rgba(255,255,255,.3)}
.badge-ok{background:rgba(34,197,94,.15);color:#22c55e;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:700}
.badge-rej{background:rgba(245,166,35,.15);color:#f5a623;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:700}
.leaflet-tooltip{background:#0d1117!important;border:1px solid rgba(255,255,255,.15)!important;
  color:#e2e8f0!important;border-radius:8px!important;font-size:12px!important;
  padding:6px 10px!important;box-shadow:0 4px 20px rgba(0,0,0,.6)!important}
.leaflet-tooltip::before{display:none!important}
</style>
</head>
<body>

<div class="header">
  <span>✈️</span>
  <h1>Mapa de Emissões</h1>
  <span>Clube do Viajante</span>
</div>

<div class="controls">
  <input id="f-origem"  type="text" placeholder="Origem…"   oninput="render()">
  <input id="f-destino" type="text" placeholder="Destino…"  oninput="render()">
  <select id="f-prog" onchange="render()">
    <option value="">Todos os programas</option>
  </select>
  <select id="f-cabine" onchange="render()">
    <option value="">Todas as cabines</option>
    <option value="Executiva">Executiva</option>
    <option value="Economica">Econômica</option>
  </select>
  <span id="contador"></span>
</div>

<div id="mapa-wrap">
  <div id="loading">Carregando passagens…</div>
  <div id="mapa"></div>
</div>

<div id="painel-detalhe">
  <div id="painel-titulo"></div>
  <div id="painel-lista"></div>
</div>

// Normaliza cidade para lookup: remove acentos, lowercase
function norm(s) {
  return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
}

// Índice normalizado
const IDX = {};
for (const [k,v] of Object.entries(COORDS)) IDX[norm(k)] = v;

function coords(nome) {
  if (!nome) return null;
  const n = norm(nome);
  if (IDX[n]) return IDX[n];
  for (const [k,v] of Object.entries(IDX)) {
    if (n.startsWith(k) || k.startsWith(n)) return v;
  }
  return null;
}

function cor(prog) {
  if (!prog) return '#6366f1';
  const p = prog.toLowerCase();
  if (p.includes('latam'))      return '#dc2626';
  if (p.includes('smiles'))     return '#f97316';
  if (p.includes('azul'))       return '#0ea5e9';
  if (p.includes('livelo'))     return '#df0979';
  if (p.includes('esfera'))     return '#e8371b';
  if (p.includes('iberia'))     return '#c0392b';
  if (p.includes('tap'))        return '#005f9e';
  if (p.includes('flying'))     return '#003087';
  if (p.includes('aadvantage')) return '#0068b2';
  if (p.includes('qatar'))      return '#8b0000';
  return '#6366f1';
}

async function carregar() {
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 20000);
    const r = await fetch(PROXY + '/passagens/listar?t=' + Date.now(), { signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    passagens = data.items || [];
    popularFiltros();
    iniciarMapa();
    render();
  } catch(e) {
    document.getElementById('loading').textContent = 'Erro ao carregar: ' + e.message;
  }
}

function popularFiltros() {
  const sel = document.getElementById('f-prog');
  const progs = [...new Set(passagens.map(p => p.programa).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Todos os programas</option>' +
    progs.map(p => `<option value="${p}">${p}</option>`).join('');
}

function iniciarMapa() {
  mapa = L.map('mapa', {
    center: [15, 10], zoom: 2, minZoom: 2, maxZoom: 10, attributionControl: false
  });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19
  }).addTo(mapa);
  document.getElementById('loading').style.display = 'none';
}

function render() {
  if (!mapa) return;

  const fp = document.getElementById('f-prog').value.toLowerCase();
  const fc = document.getElementById('f-cabine').value.toLowerCase();
  const fo = norm(document.getElementById('f-origem').value);
  const fd = norm(document.getElementById('f-destino').value);

  let ps = passagens;
  if (fp) ps = ps.filter(p => (p.programa||'').toLowerCase() === fp);
  if (fc) ps = ps.filter(p => (p.cabine||'').toLowerCase().includes(fc));
  if (fo) ps = ps.filter(p => norm(p.origem).includes(fo));
  if (fd) ps = ps.filter(p => norm(p.destino).includes(fd));

  // Remover marcadores anteriores
  mapa.eachLayer(l => { if (l._cdv) mapa.removeLayer(l); });

  // Agrupar por destino
  const grupos = {};
  for (const p of ps) {
    if (!p.destino) continue;
    if (!grupos[p.destino]) grupos[p.destino] = [];
    grupos[p.destino].push(p);
  }

  let nd = 0;
  for (const [dest, items] of Object.entries(grupos)) {
    const c = coords(dest);
    if (!c) continue;
    nd++;

    const qtd  = items.length;
    const pts  = Math.min(...items.map(p => p.pontos||0).filter(v => v > 0));
    const prog = [...new Set(items.map(p => p.programa).filter(Boolean))][0];
    const raio = Math.min(36, Math.max(10, 10 + Math.sqrt(qtd) * 4));

    const mk = L.circleMarker(c, {
      radius: raio, fillColor: cor(prog),
      color: '#fff', weight: 1.5, opacity: .9, fillOpacity: .75
    });
    mk._cdv = true;

    mk.bindTooltip(
      '<b>' + dest + '</b><br>' + qtd + ' emiss' + (qtd > 1 ? 'oes' : 'ao') +
      (pts > 0 ? '<br>' + pts.toLocaleString('pt-BR') + ' pts min.' : ''),
      { sticky: true }
    );

    mk.on('click', function() {
      const titulo = document.getElementById('painel-titulo');
      const lista  = document.getElementById('painel-lista');
      const painel = document.getElementById('painel-detalhe');
      titulo.textContent = dest + ' — ' + qtd + ' emiss' + (qtd > 1 ? 'oes' : 'ao') + ' registrada' + (qtd > 1 ? 's' : '');
      lista.innerHTML = items.map(function(p) {
        const ok    = p.fonte !== 'alerta_rejeitado';
        const badge = ok ? '<span class="badge-ok">enviado</span>' : '<span class="badge-rej">rejeitado</span>';
        const pts   = p.pontos ? p.pontos.toLocaleString('pt-BR') + ' pts' : '-';
        return '<div class="card-emissao">'
          + '<div style="display:flex;justify-content:space-between"><span class="cia">' + (p.cia||p.programa||'-') + '</span>' + badge + '</div>'
          + '<div class="rota">' + (p.origem||'') + (p.origem && p.destino ? ' > ' : '') + (p.destino||'') + '</div>'
          + '<div class="meta">' + (p.programa||'') + ' | ' + pts + ' | ' + (p.cabine||'-') + '</div>'
          + (p.datas_ida ? '<div class="datas">Ida: ' + p.datas_ida.slice(0,80) + '</div>' : '')
          + '</div>';
      }).join('');
      painel.style.display = 'block';
      painel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    mk.addTo(mapa);
  }

  document.getElementById('contador').textContent =
    nd + ' destino' + (nd !== 1 ? 's' : '') + ' | ' + ps.length + ' emiss' + (ps.length !== 1 ? 'oes' : 'ao');
}

carregar();
</script>

</html>
