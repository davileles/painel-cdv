<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mapa de Emissoes — CDV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#1e2535;--surface:#2a3246;--card:#323c54;--border:#3d4a66;
  --text:#eeeeee;--muted:#8a9bbf;--muted2:#5a6a8a;
  --accent:#ff585e;--green:#34d399;--blue:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;font-size:14px;min-height:100vh;overflow-x:hidden}

header{background:var(--surface);border-bottom:3px solid var(--accent);padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:16px;font-weight:800;letter-spacing:-.3px}
.logo em{color:var(--accent);font-style:normal}
.tagline{font-size:11px;color:var(--muted);margin-top:2px}
#contador-header{font-size:12px;color:var(--muted);font-weight:600;
  background:var(--card);padding:6px 14px;border-radius:20px;border:1px solid var(--border)}

.filtros{padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filtros input,.filtros select{
  background:var(--card);color:var(--text);border:1px solid var(--border);
  border-radius:20px;padding:7px 14px;font-size:12px;font-family:'Montserrat',sans-serif;
  outline:none;transition:border-color .2s,box-shadow .2s}
.filtros input:focus,.filtros select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,88,94,.15)}
.filtros input{width:130px}

#map-stage{position:relative;width:100%;background:var(--bg)}
#worldsvg{width:100%;height:auto;display:block}

/* Pins */
.pin{cursor:pointer}
.pin circle.halo{animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.05}}
.pin-enter{animation:pinIn .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pinIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

/* Tooltip */
#tooltip{position:fixed;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;font-size:12px;pointer-events:none;
  opacity:0;transition:opacity .12s;z-index:500;box-shadow:0 8px 30px rgba(0,0,0,.5);
  min-width:150px}
#tooltip.show{opacity:1}
#tooltip b{font-size:13px;display:block;margin-bottom:3px;color:var(--text)}
#tooltip .tt-pts{color:var(--green);font-weight:700;display:block}
#tooltip .tt-qtd{color:var(--muted);font-size:11px;display:block}

/* Loading */
#loading{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;background:var(--bg);z-index:50}
.spinner{width:30px;height:30px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9000;
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(4px)}
.overlay.open{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;
  width:100%;max-width:400px;max-height:88vh;overflow-y:auto;position:relative;
  box-shadow:0 24px 80px rgba(0,0,0,.7);animation:slideUp .22s cubic-bezier(.34,1.2,.64,1)}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.m-close{position:absolute;top:14px;right:14px;background:var(--card);border:1px solid var(--border);
  color:var(--muted);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:14px;transition:all .15s;z-index:1;border:none}
.m-close:hover{background:var(--border);color:var(--text)}
.m-hero{padding:28px 24px 18px;text-align:center;border-bottom:1px solid var(--border)}
.m-flag{font-size:46px;display:block;margin-bottom:10px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.m-dest{font-size:22px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
.m-sub{font-size:12px;color:var(--muted)}
.m-best{margin:16px 20px;background:linear-gradient(135deg,rgba(52,211,153,.1),rgba(52,211,153,.03));
  border:1px solid rgba(52,211,153,.22);border-radius:14px;padding:16px;text-align:center}
.m-best-label{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--green);text-transform:uppercase;margin-bottom:5px}
.m-best-prog{font-size:19px;font-weight:800;margin-bottom:3px}
.m-best-pts{font-size:13px;color:var(--muted)}
.m-section{padding:0 20px 4px}
.m-section-title{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--muted2);
  text-transform:uppercase;margin-bottom:8px;padding-top:14px}
.prog-list{display:flex;flex-direction:column;gap:6px}
.prog-item{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;display:flex;align-items:center;gap:10px}
.prog-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.prog-nome{flex:1;font-size:13px;font-weight:600}
.prog-pts{display:flex;gap:6px}
.pts-eco{background:rgba(52,211,153,.15);color:var(--green);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}
.pts-exec{background:rgba(96,165,250,.15);color:var(--blue);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}
.pts-na{color:var(--muted2);font-size:12px;padding:3px 4px}
.m-oport{margin:8px 20px 20px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:5px}
.oport-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,88,94,.15);
  color:var(--accent);font-size:10px;font-weight:700;border-radius:20px;
  padding:3px 10px;width:fit-content;letter-spacing:.3px;text-transform:uppercase}
.oport-rota{font-size:14px;font-weight:700}
.oport-pts{font-size:21px;font-weight:900;color:var(--accent)}
.oport-pts span{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
</style>
</head>

      <line x1="0" y1="417" x2="1000" y2="417"/>  <!-- 60S -->

</div>

<div id="tooltip">
  <b id="tt-dest"></b>
  <span class="tt-pts" id="tt-pts"></span>
  <span class="tt-qtd" id="tt-qtd"></span>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="fecharModal(event)">
  <div class="modal">
    <button class="m-close" onclick="fecharModal(null)">&#10005;</button>
    <div class="m-hero">

    </div>

      <div class="prog-list" id="m-linhas"></div>
    </div>
    <div class="m-oport" id="m-oport" style="display:none">

      <div class="oport-rota" id="m-oport-rota"></div>
      <div class="oport-pts"  id="m-oport-pts"></div>
    </div>
  </div>
</div>

function norm(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
const IDX={};
for(const[k,v]of Object.entries(CITIES))IDX[norm(k)]=v;
function getCoords(nome){
  if(!nome)return null;
  const n=norm(nome);
  if(IDX[n])return IDX[n];
  for(const[k,v]of Object.entries(IDX))if(n.startsWith(k)||k.startsWith(n))return v;
  return null;
}

const PROG_CORES={
  'latam':'#dc2626','smiles':'#f97316','azul':'#0ea5e9','azul fidelidade':'#0ea5e9',
  'livelo':'#df0979','esfera':'#e8371b','iberia':'#c0392b','iberia plus':'#c0392b',
  'tap':'#005f9e','flying blue':'#003087','aadvantage':'#0068b2','qatar':'#8b0000',
};
function corProg(p){
  if(!p)return'#6366f1';
  const s=(p||'').toLowerCase();
  for(const[k,v]of Object.entries(PROG_CORES))if(s.includes(k))return v;
  return'#6366f1';
}

function fmtPts(n){if(!n||n===Infinity)return null;return n>=1000?Math.round(n/1000)+'k':String(n);}
function tempoAtras(iso){
  if(!iso)return'';
  const h=Math.floor((Date.now()-new Date(iso))/3600000);
  const d=Math.floor(h/24);
  return d>0?'ha '+d+' dia'+(d>1?'s':''):h>0?'ha '+h+'h':'agora';
}

/* ── RENDER ─────────────────────────────────────────────── */
function render(){
  const fp=document.getElementById('f-prog').value.toLowerCase();
  const fc=document.getElementById('f-cabine').value.toLowerCase();
  const fo=norm(document.getElementById('f-origem').value);
  const fd=norm(document.getElementById('f-destino').value);
  let ps=passagens;
  if(fp)ps=ps.filter(p=>(p.programa||'').toLowerCase()===fp);
  if(fc)ps=ps.filter(p=>(p.cabine||'').toLowerCase().includes(fc));
  if(fo)ps=ps.filter(p=>norm(p.origem).includes(fo));
  if(fd)ps=ps.filter(p=>norm(p.destino).includes(fd));

  const grupos={};
  for(const p of ps){if(!p.destino)continue;if(!grupos[p.destino])grupos[p.destino]=[];grupos[p.destino].push(p);}
  grupos_atual=grupos;

  const el=document.getElementById('markers');
  el.innerHTML='';
  const NS='http://www.w3.org/2000/svg';
  let nd=0;

  for(const[dest,items]of Object.entries(grupos)){
    const c=getCoords(dest);if(!c)continue;nd++;
    const[lat,lon]=c;
    const[x,y]=proj(lat,lon);
    const qtd=items.length;
    const prog=[...new Set(items.map(p=>p.programa).filter(Boolean))][0];
    const cor=corProg(prog);
    const minPts=Math.min(...items.map(p=>p.pontos||0).filter(v=>v>0));
    const r=Math.min(20,Math.max(8,8+Math.sqrt(qtd)*2.8));

    const g=document.createElementNS(NS,'g');
    g.setAttribute('class','pin pin-enter');
    g.style.transformOrigin=`${x}px ${y}px`;

    // Halo pulsante
    const halo=document.createElementNS(NS,'circle');
    halo.setAttribute('cx',x);halo.setAttribute('cy',y);
    halo.setAttribute('r',r+6);halo.setAttribute('fill',cor);
    halo.setAttribute('class','halo');halo.style.transformOrigin=`${x}px ${y}px`;
    g.appendChild(halo);

    // Circulo
    const circ=document.createElementNS(NS,'circle');
    circ.setAttribute('cx',x);circ.setAttribute('cy',y);circ.setAttribute('r',r);
    circ.setAttribute('fill',cor);circ.setAttribute('stroke','rgba(255,255,255,.35)');
    circ.setAttribute('stroke-width','1.5');
    g.appendChild(circ);

    // Flag ou emoji no centro
    if(r>=12){
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',x);t.setAttribute('y',y+1);
      t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');
      t.setAttribute('font-size',Math.min(r*0.95,14));t.setAttribute('fill','#fff');
      t.setAttribute('pointer-events','none');
      t.textContent=flag(dest);
      g.appendChild(t);
    }

    g.addEventListener('mouseenter',e=>mostrarTooltip(e,dest,minPts,qtd));
    g.addEventListener('mousemove',e=>moverTooltip(e));
    g.addEventListener('mouseleave',esconderTooltip);
    g.addEventListener('click',()=>abrirModal(dest,grupos_atual[dest]||[]));
    el.appendChild(g);
  }

  document.getElementById('contador-header').textContent=
    nd+' destino'+(nd!==1?'s':'')+' \u00b7 '+ps.length+' emissao'+(ps.length!==1?'es':'');
}

/* ── TOOLTIP ─────────────────────────────────────────────── */
const tt=document.getElementById('tooltip');
function mostrarTooltip(e,dest,pts,qtd){
  document.getElementById('tt-dest').textContent=dest;
  document.getElementById('tt-pts').textContent=pts>0?pts.toLocaleString('pt-BR')+' pts min.':'';
  document.getElementById('tt-qtd').textContent=qtd+' emissao'+(qtd>1?'es':'');
  moverTooltip(e);tt.classList.add('show');
}
function moverTooltip(e){tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-10)+'px';}
function esconderTooltip(){tt.classList.remove('show');}

/* ── MODAL ───────────────────────────────────────────────── */
function abrirModal(dest,items){
  document.getElementById('m-flag').textContent=flag(dest);
  document.getElementById('m-dest').textContent=dest;
  const progs=[...new Set(items.map(p=>p.programa).filter(Boolean))];
  document.getElementById('m-sub').textContent=
    items.length+' emissao'+(items.length>1?'es':'')+' \u00b7 '+progs.length+' programa'+(progs.length>1?'s':'');

  const porProg={};
  for(const p of items){
    const pg=p.programa||'Outros';
    if(!porProg[pg])porProg[pg]={eco:Infinity,exec:Infinity,rec:null};
    const pts=p.pontos||0;if(!pts)continue;
    const cab=(p.cabine||'').toLowerCase();
    if(cab.includes('exec')){if(pts<porProg[pg].exec)porProg[pg].exec=pts;}
    else{if(pts<porProg[pg].eco)porProg[pg].eco=pts;}
    if(!porProg[pg].rec||new Date(p.enviadoEm)>new Date(porProg[pg].rec.enviadoEm))porProg[pg].rec=p;
  }
  const sorted=Object.entries(porProg).sort((a,b)=>{
    const pa=a[1].eco!==Infinity?a[1].eco:a[1].exec;
    const pb=b[1].eco!==Infinity?b[1].eco:b[1].exec;
    return pa-pb;
  });

  // Melhor
  const mb=document.getElementById('m-best');
  if(sorted.length){
    const[bp,bd]=sorted[0];
    const min=bd.eco!==Infinity?bd.eco:bd.exec;
    const el=document.getElementById('m-best-prog');
    el.textContent=bp;el.style.color=corProg(bp);
    document.getElementById('m-best-pts').textContent='A partir de '+min.toLocaleString('pt-BR')+' pontos';
    mb.style.display='block';
  }else mb.style.display='none';

  // Tabela
  const tw=document.getElementById('m-tabela-wrap');
  if(sorted.length){
    document.getElementById('m-linhas').innerHTML=sorted.map(([pg,d])=>{
      const eco=fmtPts(d.eco),exec=fmtPts(d.exec);
      return`<div class="prog-item">
        <span class="prog-dot" style="background:${corProg(pg)}"></span>
        <span class="prog-nome">${pg}</span>
        <div class="prog-pts">
          ${eco?`<span class="pts-eco">${eco}</span>`:'<span class="pts-na">-</span>'}
          ${exec?`<span class="pts-exec">${exec}</span>`:'<span class="pts-na">-</span>'}
        </div></div>`;
    }).join('');
    tw.style.display='block';
  }else tw.style.display='none';

  // Ultima emissao
  const op=document.getElementById('m-oport');
  const rec=items.filter(p=>p.pontos>0&&p.fonte!=='alerta_rejeitado')
    .sort((a,b)=>new Date(b.enviadoEm||0)-new Date(a.enviadoEm||0))[0];
  if(rec){
    const q=tempoAtras(rec.enviadoEm);
    document.getElementById('m-oport-badge').textContent='\u26A1 Ultima emissao'+(q?' \u00b7 '+q:'');
    document.getElementById('m-oport-rota').textContent=
      (rec.origem||'')+(rec.origem&&rec.destino?' \u2192 ':'')+( rec.destino||'');
    document.getElementById('m-oport-pts').innerHTML=
      rec.pontos.toLocaleString('pt-BR')+' <span>'+(rec.programa||'')+'</span>';
    op.style.display='flex';
  }else op.style.display='none';

  document.getElementById('overlay').classList.add('open');
}
function fecharModal(e){
  if(e&&e.target!==document.getElementById('overlay'))return;
  document.getElementById('overlay').classList.remove('open');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharModal(null);});

/* ── CARREGAR ────────────────────────────────────────────── */
async function carregar(){
  try{
    const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),20000);
    const r=await fetch(PROXY+'/passagens/listar?t='+Date.now(),{signal:ctrl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    passagens=(await r.json()).items||[];
    const sel=document.getElementById('f-prog');
    const progs=[...new Set(passagens.map(p=>p.programa).filter(Boolean))].sort();
    sel.innerHTML='<option value="">Todos os programas</option>'+
      progs.map(p=>`<option value="${p}">${p}</option>`).join('');
    document.getElementById('loading').style.display='none';
    render();
  }catch(e){
    document.getElementById('loading').innerHTML=
      `<span style="color:#ff585e;font-size:13px">Erro: ${e.message}</span>`;
  }
}
carregar();
