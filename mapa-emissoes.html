<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mapa de Emissoes — CDV</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#1e2535;--surface:#2a3246;--card:#323c54;--border:#3d4a66;
  --text:#eeeeee;--muted:#8a9bbf;--muted2:#5a6a8a;
  --accent:#ff585e;--green:#34d399;--blue:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;font-size:14px;min-height:100vh;overflow-x:hidden}

/* HEADER */
header{background:var(--surface);border-bottom:3px solid var(--accent);padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:500;gap:12px}
.logo{font-size:16px;font-weight:800;letter-spacing:-.3px}
.logo em{color:var(--accent);font-style:normal}
.tagline{font-size:11px;color:var(--muted);margin-top:2px}
#badge-count{font-size:12px;color:var(--muted);font-weight:600;
  background:var(--card);padding:6px 14px;border-radius:20px;border:1px solid var(--border);white-space:nowrap}

/* FILTROS */
.filtros{padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filtros input,.filtros select{
  background:var(--card);color:var(--text);border:1px solid var(--border);
  border-radius:20px;padding:7px 14px;font-size:12px;font-family:'Montserrat',sans-serif;
  outline:none;transition:border-color .2s,box-shadow .2s}
.filtros input:focus,.filtros select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,88,94,.15)}
.filtros input{width:130px}

/* MAPA */
#map{height:calc(100vh - 118px);width:100%}

/* Leaflet overrides — tiles coloridos, oceano azul escuro */
.leaflet-container{background:#1a2540}
.leaflet-tile-pane{filter:saturate(0.8) brightness(0.78) hue-rotate(5deg)}

/* PIN customizado */
.pin-wrapper{position:relative;cursor:pointer}
.pin-circle{
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;border:2px solid rgba(255,255,255,.4);
  box-shadow:0 3px 12px rgba(0,0,0,.5);
  transition:transform .15s,box-shadow .15s;
  animation:pinIn .35s cubic-bezier(.34,1.56,.64,1) both;
  position:relative;
}
.pin-circle:hover{transform:scale(1.18);box-shadow:0 6px 20px rgba(0,0,0,.6)}
.pin-pulse{
  position:absolute;inset:-6px;border-radius:50%;
  animation:pulse 2.5s ease-in-out infinite;pointer-events:none;
}
@keyframes pinIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.05;transform:scale(1.3)}}

/* Tooltip Leaflet */
.leaflet-tooltip{
  background:var(--surface)!important;border:1px solid var(--border)!important;
  color:var(--text)!important;border-radius:10px!important;
  font-family:'Montserrat',sans-serif!important;font-size:12px!important;
  padding:8px 12px!important;box-shadow:0 6px 24px rgba(0,0,0,.5)!important;
  white-space:nowrap!important}
.leaflet-tooltip::before{display:none!important}
.tt-dest{font-weight:700;font-size:13px;display:block;margin-bottom:3px}
.tt-pts{color:var(--green);font-weight:700;display:block}
.tt-qtd{color:var(--muted);font-size:11px;display:block;margin-top:1px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(4px)}
.overlay.open{display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;
  width:100%;max-width:400px;max-height:88vh;overflow-y:auto;position:relative;
  box-shadow:0 24px 80px rgba(0,0,0,.7);animation:slideUp .22s cubic-bezier(.34,1.2,.64,1)}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.m-close{position:absolute;top:14px;right:14px;background:var(--card);
  border:1px solid var(--border);color:var(--muted);width:30px;height:30px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px;transition:all .15s;border:none}
.m-close:hover{background:var(--border);color:var(--text)}
.m-hero{padding:26px 24px 16px;text-align:center;border-bottom:1px solid var(--border)}
.m-flag{font-size:44px;display:block;margin-bottom:10px}
.m-dest{font-size:22px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
.m-sub{font-size:12px;color:var(--muted)}
.m-best{margin:14px 20px;background:linear-gradient(135deg,rgba(52,211,153,.1),rgba(52,211,153,.03));
  border:1px solid rgba(52,211,153,.22);border-radius:14px;padding:14px;text-align:center}
.m-best-label{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--green);text-transform:uppercase;margin-bottom:4px}
.m-best-prog{font-size:18px;font-weight:800;margin-bottom:3px}
.m-best-pts{font-size:13px;color:var(--muted)}
.m-section{padding:0 20px 4px}
.m-section-title{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--muted2);
  text-transform:uppercase;margin-bottom:8px;padding-top:12px}
.prog-list{display:flex;flex-direction:column;gap:5px}
.prog-item{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:9px 12px;display:flex;align-items:center;gap:10px}
.prog-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.prog-nome{flex:1;font-size:13px;font-weight:600}
.prog-pts{display:flex;gap:5px}
.pts-eco{background:rgba(52,211,153,.15);color:var(--green);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700}
.pts-exec{background:rgba(96,165,250,.15);color:var(--blue);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700}
.pts-na{color:var(--muted2);font-size:12px;padding:2px 4px}
.m-oport{margin:6px 20px 20px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:5px}
.oport-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,88,94,.15);
  color:var(--accent);font-size:10px;font-weight:700;border-radius:20px;
  padding:3px 10px;width:fit-content;letter-spacing:.3px;text-transform:uppercase}
.oport-rota{font-size:14px;font-weight:700;margin-top:2px}
.oport-pts{font-size:20px;font-weight:900;color:var(--accent)}
.oport-pts span{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Clube do <em>Viajante</em></div>
    <div class="tagline">Mapa de Emissoes por Milhas</div>
  </div>
  <div id="badge-count">Carregando...</div>
</header>

<div class="filtros">
  <input id="f-origem"  type="text" placeholder="Origem..."   oninput="render()">
  <input id="f-destino" type="text" placeholder="Destino..."  oninput="render()">
  <select id="f-prog" onchange="render()"><option value="">Todos os programas</option></select>
  <select id="f-cabine" onchange="render()">
    <option value="">Todas as cabines</option>
    <option value="Executiva">Executiva</option>
    <option value="Economica">Economica</option>
  </select>
</div>

<div id="map"></div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="fecharModal(event)">
  <div class="modal">
    <button class="m-close" onclick="fecharModal(null)">&#10005;</button>
    <div class="m-hero">
      <span class="m-flag" id="m-flag"></span>
      <div class="m-dest" id="m-dest"></div>
      <div class="m-sub"  id="m-sub"></div>
    </div>
    <div class="m-best" id="m-best" style="display:none">
      <div class="m-best-label">Melhor opcao</div>
      <div class="m-best-prog" id="m-best-prog"></div>
      <div class="m-best-pts"  id="m-best-pts"></div>
    </div>
    <div class="m-section" id="m-tabela-wrap" style="display:none">
      <div class="m-section-title">Por programa</div>
      <div class="prog-list" id="m-linhas"></div>
    </div>
    <div class="m-oport" id="m-oport" style="display:none">
      <div class="oport-badge" id="m-oport-badge">&#9889; Ultima emissao</div>
      <div class="oport-rota" id="m-oport-rota"></div>
      <div class="oport-pts"  id="m-oport-pts"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

const PROXY = 'https://cdv-proxy-production.up.railway.app';

/* ── MAPA ─────────────────────────────────────────────── */
function initMapa() {
  mapaLeaflet = L.map('map', {
    center: [20, 10], zoom: 2, minZoom: 2, maxZoom: 6,
    attributionControl: false, zoomControl: true
  });

  // Tile estilo aquarela/ilustrativo — Stamen Watercolor via Stadia
  // CartoDB Voyager — colorido, amigável, sem autenticação
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: ''
  }).addTo(mapaLeaflet);

  camadaMarcadores = L.layerGroup().addTo(mapaLeaflet);
}

function norm(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
const IDX={};
for(const[k,v]of Object.entries(CITIES))IDX[norm(k)]=v;
function getCoords(nome){
  if(!nome)return null;
  const n=norm(nome);
  if(IDX[n])return IDX[n];
  for(const[k,v]of Object.entries(IDX))if(n.startsWith(k)||k.startsWith(n))return v;
  return null;
}

const PROG_CORES={'latam':'#dc2626','smiles':'#f97316','azul':'#0ea5e9','azul fidelidade':'#0ea5e9','livelo':'#df0979','esfera':'#e8371b','iberia':'#c0392b','iberia plus':'#c0392b','tap':'#005f9e','flying blue':'#003087','aadvantage':'#0068b2','qatar':'#8b0000'};
function corProg(p){if(!p)return'#6366f1';const s=p.toLowerCase();for(const[k,v]of Object.entries(PROG_CORES))if(s.includes(k))return v;return'#6366f1';}

function flag(dest){
  const d=norm(dest);
  const M={'paris':'\uD83C\uDDEB\uD83C\uDDF7','cdg':'\uD83C\uDDEB\uD83C\uDDF7','ory':'\uD83C\uDDEB\uD83C\uDDF7','lisboa':'\uD83C\uDDF5\uD83C\uDDF9','lis':'\uD83C\uDDF5\uD83C\uDDF9','porto':'\uD83C\uDDF5\uD83C\uDDF9','opo':'\uD83C\uDDF5\uD83C\uDDF9','madrid':'\uD83C\uDDEA\uD83C\uDDF8','barcelona':'\uD83C\uDDEA\uD83C\uDDF8','mad':'\uD83C\uDDEA\uD83C\uDDF8','bcn':'\uD83C\uDDEA\uD83C\uDDF8','roma':'\uD83C\uDDEE\uD83C\uDDF9','milao':'\uD83C\uDDEE\uD83C\uDDF9','fco':'\uD83C\uDDEE\uD83C\uDDF9','mxp':'\uD83C\uDDEE\uD83C\uDDF9','berlim':'\uD83C\uDDE9\uD83C\uDDEA','munique':'\uD83C\uDDE9\uD83C\uDDEA','frankfurt':'\uD83C\uDDE9\uD83C\uDDEA','ber':'\uD83C\uDDE9\uD83C\uDDEA','fra':'\uD83C\uDDE9\uD83C\uDDEA','muc':'\uD83C\uDDE9\uD83C\uDDEA','amsterdam':'\uD83C\uDDF3\uD83C\uDDF1','ams':'\uD83C\uDDF3\uD83C\uDDF1','londres':'\uD83C\uDDEC\uD83C\uDDE7','lhr':'\uD83C\uDDEC\uD83C\uDDE7','lgw':'\uD83C\uDDEC\uD83C\uDDE7','zurique':'\uD83C\uDDE8\uD83C\uDDED','genebra':'\uD83C\uDDE8\uD83C\uDDED','zrh':'\uD83C\uDDE8\uD83C\uDDED','viena':'\uD83C\uDDE6\uD83C\uDDF9','vie':'\uD83C\uDDE6\uD83C\uDDF9','atenas':'\uD83C\uDDEC\uD83C\uDDF7','istanbul':'\uD83C\uDDF9\uD83C\uDDF7','ist':'\uD83C\uDDF9\uD83C\uDDF7','nova york':'\uD83C\uDDFA\uD83C\uDDF8','jfk':'\uD83C\uDDFA\uD83C\uDDF8','ewr':'\uD83C\uDDFA\uD83C\uDDF8','miami':'\uD83C\uDDFA\uD83C\uDDF8','mia':'\uD83C\uDDFA\uD83C\uDDF8','orlando':'\uD83C\uDDFA\uD83C\uDDF8','chicago':'\uD83C\uDDFA\uD83C\uDDF8','los angeles':'\uD83C\uDDFA\uD83C\uDDF8','lax':'\uD83C\uDDFA\uD83C\uDDF8','toronto':'\uD83C\uDDE8\uD83C\uDDE6','vancouver':'\uD83C\uDDE8\uD83C\uDDE6','cancun':'\uD83C\uDDF2\uD83C\uDDFD','cun':'\uD83C\uDDF2\uD83C\uDDFD','mexico':'\uD83C\uDDF2\uD83C\uDDFD','buenos aires':'\uD83C\uDDE6\uD83C\uDDF7','eze':'\uD83C\uDDE6\uD83C\uDDF7','santiago':'\uD83C\uDDE8\uD83C\uDDF1','scl':'\uD83C\uDDE8\uD83C\uDDF1','lima':'\uD83C\uDDF5\uD83C\uDDEA','lim':'\uD83C\uDDF5\uD83C\uDDEA','bogota':'\uD83C\uDDE8\uD83C\uDDF4','dubai':'\uD83C\uDDE6\uD83C\uDDEA','dxb':'\uD83C\uDDE6\uD83C\uDDEA','abu dhabi':'\uD83C\uDDE6\uD83C\uDDEA','doha':'\uD83C\uDDF6\uD83C\uDDE6','doh':'\uD83C\uDDF6\uD83C\uDDE6','toquio':'\uD83C\uDDEF\uD83C\uDDF5','nrt':'\uD83C\uDDEF\uD83C\uDDF5','osaka':'\uD83C\uDDEF\uD83C\uDDF5','seul':'\uD83C\uDDF0\uD83C\uDDF7','icn':'\uD83C\uDDF0\uD83C\uDDF7','bali':'\uD83C\uDDEE\uD83C\uDDE9','dps':'\uD83C\uDDEE\uD83C\uDDE9','sydney':'\uD83C\uDDE6\uD83C\uDDFA','melbourne':'\uD83C\uDDE6\uD83C\uDDFA','bangkok':'\uD83C\uDDF9\uD83C\uDDED','bkk':'\uD83C\uDDF9\uD83C\uDDED','cingapura':'\uD83C\uDDF8\uD83C\uDDEC','sin':'\uD83C\uDDF8\uD83C\uDDEC','hong kong':'\uD83C\uDDED\uD83C\uDDF0','hkg':'\uD83C\uDDED\uD83C\uDDF0','johannesburgo':'\uD83C\uDDFF\uD83C\uDDE6'};
  for(const[k,v]of Object.entries(M))if(d===k||d.startsWith(k))return v;
  const br=['sao paulo','rio de janeiro','brasilia','belo horizonte','salvador','fortaleza','recife','curitiba','porto alegre','manaus','belem','natal','maceio','campo grande','goiania','florianopolis','uberlandia','campinas','vitoria','foz'];
  for(const b of br)if(d.includes(b)||norm(b).startsWith(d.substring(0,4)))return'\uD83C\uDDE7\uD83C\uDDF7';
  return'\u2708\uFE0F';
}

function fmtPts(n){if(!n||n===Infinity)return null;return n>=1000?Math.round(n/1000)+'k':String(n);}
function tempoAtras(iso){
  if(!iso)return'';
  const h=Math.floor((Date.now()-new Date(iso))/3600000);
  const d=Math.floor(h/24);
  if(d>0)return'ha '+d+' dia'+(d>1?'s':'');
  if(h>0)return'ha '+h+'h';
  return'agora';
}

/* ── RENDER ─────────────────────────────────────────────── */
function render(){
  if(!mapaLeaflet)return;
  const fp=document.getElementById('f-prog').value.toLowerCase();
  const fc=document.getElementById('f-cabine').value.toLowerCase();
  const fo=norm(document.getElementById('f-origem').value);
  const fd=norm(document.getElementById('f-destino').value);
  let ps=passagens;
  if(fp)ps=ps.filter(p=>(p.programa||'').toLowerCase()===fp);
  if(fc)ps=ps.filter(p=>(p.cabine||'').toLowerCase().includes(fc));
  if(fo)ps=ps.filter(p=>norm(p.origem).includes(fo));
  if(fd)ps=ps.filter(p=>norm(p.destino).includes(fd));

  camadaMarcadores.clearLayers();
  const grupos={};
  for(const p of ps){if(!p.destino)continue;if(!grupos[p.destino])grupos[p.destino]=[];grupos[p.destino].push(p);}

  let nd=0;
  for(const[dest,items]of Object.entries(grupos)){
    const c=getCoords(dest);if(!c)continue;nd++;
    const[lat,lon]=c;
    const qtd=items.length;
    const prog=[...new Set(items.map(p=>p.programa).filter(Boolean))][0];
    const cor=corProg(prog);
    const minPts=Math.min(...items.map(p=>p.pontos||0).filter(v=>v>0));
    const size=Math.min(54,Math.max(32,32+Math.sqrt(qtd)*5));
    const emoji=flag(dest);

    const icon=L.divIcon({
      className:'pin-wrapper',
      html:`<div style="position:relative;width:${size}px;height:${size}px">
        <div class="pin-pulse" style="background:${cor};inset:-8px"></div>
        <div class="pin-circle" style="width:${size}px;height:${size}px;background:${cor};font-size:${Math.round(size*0.45)}px">
          ${emoji}
        </div>
      </div>`,
      iconSize:[size,size],
      iconAnchor:[size/2,size/2]
    });

    const marker=L.marker([lat,lon],{icon});

    const ttHtml=`<span class="tt-dest">${dest}</span>`+
      (minPts>0?`<span class="tt-pts">${minPts.toLocaleString('pt-BR')} pts min.</span>`:'')+ 
      `<span class="tt-qtd">${qtd} emissao${qtd>1?'es':''}</span>`;
    marker.bindTooltip(ttHtml,{sticky:true,offset:[12,0]});
    marker.on('click',()=>abrirModal(dest,grupos[dest]||[]));
    camadaMarcadores.addLayer(marker);
  }

  document.getElementById('badge-count').textContent=
    nd+' destino'+(nd!==1?'s':'')+' \u00b7 '+ps.length+' emissao'+(ps.length!==1?'es':'');
}

/* ── MODAL ───────────────────────────────────────────────── */
function abrirModal(dest,items){
  document.getElementById('m-flag').textContent=flag(dest);
  document.getElementById('m-dest').textContent=dest;
  const progs=[...new Set(items.map(p=>p.programa).filter(Boolean))];
  document.getElementById('m-sub').textContent=
    items.length+' emissao'+(items.length>1?'es':'')+' \u00b7 '+progs.length+' programa'+(progs.length>1?'s':'');

  const porProg={};
  for(const p of items){
    const pg=p.programa||'Outros';
    if(!porProg[pg])porProg[pg]={eco:Infinity,exec:Infinity,rec:null};
    const pts=p.pontos||0;if(!pts)continue;
    const cab=(p.cabine||'').toLowerCase();
    if(cab.includes('exec')){if(pts<porProg[pg].exec)porProg[pg].exec=pts;}
    else{if(pts<porProg[pg].eco)porProg[pg].eco=pts;}
    if(!porProg[pg].rec||new Date(p.enviadoEm)>new Date(porProg[pg].rec.enviadoEm))porProg[pg].rec=p;
  }
  const sorted=Object.entries(porProg).sort((a,b)=>{
    const pa=a[1].eco!==Infinity?a[1].eco:a[1].exec;
    const pb=b[1].eco!==Infinity?b[1].eco:b[1].exec;
    return pa-pb;
  });

  const mb=document.getElementById('m-best');
  if(sorted.length){
    const[bp,bd]=sorted[0];
    const min=bd.eco!==Infinity?bd.eco:bd.exec;
    const el=document.getElementById('m-best-prog');
    el.textContent=bp;el.style.color=corProg(bp);
    document.getElementById('m-best-pts').textContent='A partir de '+min.toLocaleString('pt-BR')+' pontos';
    mb.style.display='block';
  }else mb.style.display='none';

  const tw=document.getElementById('m-tabela-wrap');
  if(sorted.length){
    document.getElementById('m-linhas').innerHTML=sorted.map(([pg,d])=>{
      const eco=fmtPts(d.eco),exec=fmtPts(d.exec);
      return`<div class="prog-item">
        <span class="prog-dot" style="background:${corProg(pg)}"></span>
        <span class="prog-nome">${pg}</span>
        <div class="prog-pts">
          ${eco?`<span class="pts-eco">${eco}</span>`:'<span class="pts-na">-</span>'}
          ${exec?`<span class="pts-exec">${exec}</span>`:'<span class="pts-na">-</span>'}
        </div></div>`;
    }).join('');
    tw.style.display='block';
  }else tw.style.display='none';

  const op=document.getElementById('m-oport');
  const rec=items.filter(p=>p.pontos>0&&p.fonte!=='alerta_rejeitado')
    .sort((a,b)=>new Date(b.enviadoEm||0)-new Date(a.enviadoEm||0))[0];
  if(rec){
    const q=tempoAtras(rec.enviadoEm);
    document.getElementById('m-oport-badge').textContent='\u26A1 Ultima emissao'+(q?' \u00b7 '+q:'');
    document.getElementById('m-oport-rota').textContent=(rec.origem||'')+(rec.origem&&rec.destino?' \u2192 ':'')+( rec.destino||'');
    document.getElementById('m-oport-pts').innerHTML=rec.pontos.toLocaleString('pt-BR')+' <span>'+(rec.programa||'')+'</span>';
    op.style.display='flex';
  }else op.style.display='none';

  document.getElementById('overlay').classList.add('open');
}
function fecharModal(e){
  if(e&&e.target!==document.getElementById('overlay'))return;
  document.getElementById('overlay').classList.remove('open');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharModal(null);});

/* ── CARREGAR ────────────────────────────────────────────── */
async function carregar(){
  try{
    initMapa();
    const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),20000);
    const r=await fetch(PROXY+'/passagens/listar?t='+Date.now(),{signal:ctrl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    passagens=(await r.json()).items||[];
    const sel=document.getElementById('f-prog');
    const progs=[...new Set(passagens.map(p=>p.programa).filter(Boolean))].sort();
    sel.innerHTML='<option value="">Todos os programas</option>'+progs.map(p=>`<option value="${p}">${p}</option>`).join('');
    render();
  }catch(e){
    document.getElementById('badge-count').textContent='Erro: '+e.message;
    initMapa();
  }
}
carregar();
</script>
