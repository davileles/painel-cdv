<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mapa de Emissoes — CDV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#1e2535;--surface:#2a3246;--card:#323c54;--border:#3d4a66;
  --text:#eeeeee;--muted:#8a9bbf;--muted2:#5a6a8a;
  --accent:#ff585e;--green:#34d399;--blue:#60a5fa;
  --latam:#dc2626;--smiles:#f97316;--azul:#0ea5e9;
  --livelo:#df0979;--esfera:#e8371b;--iberia:#c0392b;
  --tap:#005f9e;--flying:#003087;--aa:#0068b2;--qatar:#8b0000;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;
  font-size:14px;min-height:100vh;overflow-x:hidden}

/* HEADER */
header{background:var(--surface);border-bottom:3px solid var(--accent);
  padding:14px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;gap:12px}
.logo{font-size:16px;font-weight:800;letter-spacing:-.3px}
.logo em{color:var(--accent);font-style:normal}
.tagline{font-size:11px;color:var(--muted);margin-top:2px}
#contador-header{font-size:12px;color:var(--muted);font-weight:600;
  background:var(--card);padding:6px 14px;border-radius:20px;border:1px solid var(--border)}

/* FILTROS */
.filtros{padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filtros input,.filtros select{
  background:var(--card);color:var(--text);border:1px solid var(--border);
  border-radius:20px;padding:7px 14px;font-size:12px;font-family:'Montserrat',sans-serif;
  outline:none;transition:border-color .2s,box-shadow .2s}
.filtros input:focus,.filtros select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,88,94,.15)}
.filtros input{width:130px}
.filtros select{cursor:pointer}

/* SVG MAP CONTAINER */
#map-stage{position:relative;width:100%;background:var(--bg);
  overflow:hidden;cursor:grab;user-select:none}
#map-stage:active{cursor:grabbing}
#map-svg-wrap{position:relative;width:100%;height:100%}
#worldmap{width:100%;height:100%;display:block}

/* PIN MARKERS */
.pin{cursor:pointer;transition:transform .15s}
.pin:hover .pin-circle{filter:brightness(1.2)}
.pin-pulse{animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{
  0%,100%{opacity:.35;r:attr(r)}
  50%{opacity:.1}
}
.pin-enter{animation:pinIn .35s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pinIn{
  from{transform:scale(0) translateY(10px);opacity:0}
  to{transform:scale(1) translateY(0);opacity:1}
}

/* TOOLTIP FLUTUANTE */
#tooltip{position:fixed;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;font-size:12px;pointer-events:none;
  opacity:0;transition:opacity .15s;z-index:500;box-shadow:0 8px 30px rgba(0,0,0,.5);
  max-width:200px;white-space:nowrap}
#tooltip.show{opacity:1}
#tooltip strong{font-size:13px;display:block;margin-bottom:2px}
#tooltip .tt-pts{color:var(--green);font-weight:700}
#tooltip .tt-qtd{color:var(--muted);font-size:11px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9000;
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(4px)}
.overlay.open{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;
  width:100%;max-width:400px;max-height:88vh;overflow-y:auto;position:relative;
  box-shadow:0 24px 80px rgba(0,0,0,.7);animation:slideUp .25s cubic-bezier(.34,1.2,.64,1)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-track{background:transparent}
.modal::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.m-close{position:absolute;top:14px;right:14px;background:var(--card);
  border:1px solid var(--border);color:var(--muted);width:28px;height:28px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;transition:all .15s;z-index:1}
.m-close:hover{background:var(--border);color:var(--text)}
.m-hero{padding:28px 24px 20px;text-align:center;border-bottom:1px solid var(--border)}
.m-flag{font-size:48px;margin-bottom:10px;display:block;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.m-dest{font-size:24px;font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
.m-sub{font-size:12px;color:var(--muted)}
.m-best{margin:16px 20px;background:linear-gradient(135deg,rgba(52,211,153,.12),rgba(52,211,153,.04));
  border:1px solid rgba(52,211,153,.25);border-radius:14px;padding:16px;text-align:center}
.m-best-label{font-size:10px;font-weight:700;letter-spacing:1px;
  color:var(--green);text-transform:uppercase;margin-bottom:6px}
.m-best-prog{font-size:20px;font-weight:800;margin-bottom:4px}
.m-best-pts{font-size:13px;color:var(--muted)}
.m-section{padding:0 20px 6px}
.m-section-title{font-size:10px;font-weight:700;letter-spacing:.8px;
  color:var(--muted2);text-transform:uppercase;margin-bottom:8px;padding-top:14px}
.prog-list{display:flex;flex-direction:column;gap:6px}
.prog-item{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;display:flex;align-items:center;gap:10px}
.prog-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.prog-item .nome{flex:1;font-size:13px;font-weight:600}
.prog-item .pts-wrap{display:flex;gap:8px}
.prog-item .pts-eco{background:rgba(52,211,153,.15);color:var(--green);
  border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}
.prog-item .pts-exec{background:rgba(96,165,250,.15);color:var(--blue);
  border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}
.prog-item .pts-na{color:var(--muted2);font-size:12px;padding:3px 4px}
.m-oport{margin:6px 20px 20px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.m-oport-badge{display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,88,94,.15);color:var(--accent);
  font-size:10px;font-weight:700;border-radius:20px;padding:3px 10px;
  width:fit-content;letter-spacing:.4px;text-transform:uppercase}
.m-oport-rota{font-size:14px;font-weight:700}
.m-oport-pts{font-size:22px;font-weight:900;color:var(--accent)}
.m-oport-pts span{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}

/* LOADING */
#loading{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:50}
.spinner{width:32px;height:32px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

  'Cingapura':[103.8198,1.3521],'SIN':[103.8198,1.3521],
  'Bangkok':[100.5018,13.7563],'BKK':[100.5018,13.7563],
  'Bali':[115.092,-8.3405],'DPS':[115.092,-8.3405],
  'Sydney':[151.2093,-33.8688],'SYD':[151.2093,-33.8688],
  'Melbourne':[144.9631,-37.8136],'MEL':[144.9631,-37.8136],
  'Auckland':[174.7633,-36.8485],'AKL':[174.7633,-36.8485],
  'Mumbai':[72.8777,19.076],'BOM':[72.8777,19.076],
  'Delhi':[77.1025,28.7041],'DEL':[77.1025,28.7041],
};

function norm(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
const IDX={};
for(const[k,v]of Object.entries(CITY_COORDS))IDX[norm(k)]=v;
function getCoords(nome){
  if(!nome)return null;
  const n=norm(nome);
  if(IDX[n])return IDX[n];
  for(const[k,v]of Object.entries(IDX)){if(n.startsWith(k)||k.startsWith(n))return v;}
  return null;
}

const PROG_CORES={
  'latam':'#dc2626','smiles':'#f97316','azul':'#0ea5e9','azul fidelidade':'#0ea5e9',
  'livelo':'#df0979','esfera':'#e8371b','iberia':'#c0392b','iberia plus':'#c0392b',
  'tap':'#005f9e','flying blue':'#003087','aadvantage':'#0068b2','qatar':'#8b0000',
};
function corProg(p){
  if(!p)return'#6366f1';
  const s=p.toLowerCase();
  for(const[k,v]of Object.entries(PROG_CORES))if(s.includes(k))return v;
  return'#6366f1';
}

function flag(dest){
  const d=norm(dest);
  if(d.includes('paris')||d.includes('cdg')||d.includes('ory'))return'\uD83C\uDDEB\uD83C\uDDF7';
  if(d.includes('lisboa')||d.includes('porto')||d.includes('lis')||d.includes('opo'))return'\uD83C\uDDF5\uD83C\uDDF9';
  if(d.includes('madrid')||d.includes('barcelona')||d.includes('mad')||d.includes('bcn'))return'\uD83C\uDDEA\uD83C\uDDF8';
  if(d.includes('roma')||d.includes('milao')||d.includes('fco')||d.includes('mxp'))return'\uD83C\uDDEE\uD83C\uDDF9';
  if(d.includes('berlim')||d.includes('munique')||d.includes('frankfurt'))return'\uD83C\uDDE9\uD83C\uDDEA';
  if(d.includes('amsterdam')||d.includes('ams'))return'\uD83C\uDDF3\uD83C\uDDF1';
  if(d.includes('londres')||d.includes('lhr')||d.includes('lgw'))return'\uD83C\uDDEC\uD83C\uDDE7';
  if(d.includes('zurique')||d.includes('genebra'))return'\uD83C\uDDE8\uD83C\uDDED';
  if(d.includes('nova york')||d.includes('jfk')||d.includes('ewr'))return'\uD83C\uDDFA\uD83C\uDDF8';
  if(d.includes('miami')||d.includes('orlando')||d.includes('chicago')||d.includes('los angeles'))return'\uD83C\uDDFA\uD83C\uDDF8';
  if(d.includes('toronto')||d.includes('vancouver'))return'\uD83C\uDDE8\uD83C\uDDE6';
  if(d.includes('cancun')||d.includes('mexico'))return'\uD83C\uDDF2\uD83C\uDDFD';
  if(d.includes('buenos aires'))return'\uD83C\uDDE6\uD83C\uDDF7';
  if(d.includes('santiago'))return'\uD83C\uDDE8\uD83C\uDDF1';
  if(d.includes('lima'))return'\uD83C\uDDF5\uD83C\uDDEA';
  if(d.includes('bogota'))return'\uD83C\uDDE8\uD83C\uDDF4';
  if(d.includes('dubai')||d.includes('abu dhabi')||d.includes('dxb'))return'\uD83C\uDDE6\uD83C\uDDEA';
  if(d.includes('doha')||d.includes('doh'))return'\uD83C\uDDF6\uD83C\uDDE6';
  if(d.includes('toquio')||d.includes('osaka')||d.includes('nrt'))return'\uD83C\uDDEF\uD83C\uDDF5';
  if(d.includes('seul')||d.includes('icn'))return'\uD83C\uDDF0\uD83C\uDDF7';
  if(d.includes('bali')||d.includes('dps'))return'\uD83C\uDDEE\uD83C\uDDE9';
  if(d.includes('sydney')||d.includes('melbourne'))return'\uD83C\uDDE6\uD83C\uDDFA';
  if(d.includes('bangkok')||d.includes('bkk'))return'\uD83C\uDDF9\uD83C\uDDED';
  if(d.includes('cingapura')||d.includes('sin'))return'\uD83C\uDDF8\uD83C\uDDEC';
  if(d.includes('hong kong')||d.includes('hkg'))return'\uD83C\uDDED\uD83C\uDDF0';
  if(d.includes('johannesburgo'))return'\uD83C\uDDFF\uD83C\uDDE6';
  return'\u2708\uFE0F';
}

function fmtPts(n){
  if(!n||n===Infinity)return null;
  if(n>=1000)return Math.round(n/1000)+'k';
  return String(n);
}

function tempoAtras(iso){
  if(!iso)return'';
  const d=Math.floor((Date.now()-new Date(iso))/86400000);
  const h=Math.floor((Date.now()-new Date(iso))/3600000);
  if(d>0)return'ha '+d+' dia'+(d>1?'s':'');
  if(h>0)return'ha '+h+'h';
  return'agora';
}

/* ── MAPA SVG ───────────────────────────────────────────── */
let grupos_atual = {};

function render(){
  const fp=document.getElementById('f-prog').value.toLowerCase();
  const fc=document.getElementById('f-cabine').value.toLowerCase();
  const fo=norm(document.getElementById('f-origem').value);
  const fd=norm(document.getElementById('f-destino').value);

  let ps=passagens;
  if(fp)ps=ps.filter(p=>(p.programa||'').toLowerCase()===fp);
  if(fc)ps=ps.filter(p=>(p.cabine||'').toLowerCase().includes(fc));
  if(fo)ps=ps.filter(p=>norm(p.origem).includes(fo));
  if(fd)ps=ps.filter(p=>norm(p.destino).includes(fd));

  const grupos={};
  for(const p of ps){
    if(!p.destino)continue;
    if(!grupos[p.destino])grupos[p.destino]=[];
    grupos[p.destino].push(p);
  }
  grupos_atual=grupos;

  const el=document.getElementById('markers');
  el.innerHTML='';

  let nd=0;
  const svgNS='http://www.w3.org/2000/svg';

  for(const[dest,items]of Object.entries(grupos)){
    const c=getCoords(dest);
    if(!c)continue;
    nd++;

    const[lon,lat]=c;
    const[x,y]=proj(lon,lat);
    const qtd=items.length;
    const prog=[...new Set(items.map(p=>p.programa).filter(Boolean))][0];
    const cor=corProg(prog);
    const minPts=Math.min(...items.map(p=>p.pontos||0).filter(v=>v>0));
    const r=Math.min(18,Math.max(7,7+Math.sqrt(qtd)*2.5));

    const g=document.createElementNS(svgNS,'g');
    g.setAttribute('class','pin pin-enter');
    g.style.transformOrigin=x+'px '+y+'px';
    g.style.cursor='pointer';

    // Halo pulsante
    const halo=document.createElementNS(svgNS,'circle');
    halo.setAttribute('cx',x);halo.setAttribute('cy',y);
    halo.setAttribute('r',r+5);halo.setAttribute('fill',cor);
    halo.setAttribute('opacity','0.2');halo.setAttribute('class','pin-pulse');
    halo.style.transformOrigin=x+'px '+y+'px';
    g.appendChild(halo);

    // Circulo principal
    const circ=document.createElementNS(svgNS,'circle');
    circ.setAttribute('cx',x);circ.setAttribute('cy',y);
    circ.setAttribute('r',r);circ.setAttribute('fill',cor);
    circ.setAttribute('stroke','rgba(255,255,255,.4)');
    circ.setAttribute('stroke-width','1.5');
    g.appendChild(circ);

    // Emoji ou letra no centro
    if(r>=11){
      const txt=document.createElementNS(svgNS,'text');
      txt.setAttribute('x',x);txt.setAttribute('y',y+1);
      txt.setAttribute('text-anchor','middle');txt.setAttribute('dominant-baseline','middle');
      txt.setAttribute('font-size',r*0.9);txt.setAttribute('fill','#fff');
      txt.setAttribute('font-weight','800');txt.setAttribute('font-family','Montserrat,sans-serif');
      txt.setAttribute('pointer-events','none');
      txt.textContent=flag(dest);
      g.appendChild(txt);
    }

    // Eventos
    g.addEventListener('mouseenter',function(e){mostrarTooltip(e,dest,minPts,qtd);});
    g.addEventListener('mousemove',function(e){moverTooltip(e);});
    g.addEventListener('mouseleave',esconderTooltip);
    g.addEventListener('click',function(){abrirModal(dest,grupos_atual[dest]||[]);});

    el.appendChild(g);
  }

  const cnt=nd+' destino'+(nd!==1?'s':'')+' \u00b7 '+ps.length+' emissao'+(ps.length!==1?'es':'');
  document.getElementById('contador-header').textContent=cnt;
}

/* ── TOOLTIP ─────────────────────────────────────────────── */
const ttEl=document.getElementById('tooltip');
function mostrarTooltip(e,dest,pts,qtd){
  document.getElementById('tt-dest').textContent=dest;
  document.getElementById('tt-pts').textContent=pts>0?pts.toLocaleString('pt-BR')+' pts min.':'';
  document.getElementById('tt-qtd').textContent=qtd+' emissao'+(qtd>1?'es':'');
  moverTooltip(e);ttEl.classList.add('show');
}
function moverTooltip(e){
  ttEl.style.left=(e.clientX+14)+'px';ttEl.style.top=(e.clientY-10)+'px';
}
function esconderTooltip(){ttEl.classList.remove('show');}

/* ── MODAL ───────────────────────────────────────────────── */
function abrirModal(dest,items){
  document.getElementById('m-flag').textContent=flag(dest);
  document.getElementById('m-dest').textContent=dest;
  const total=items.length;
  const progs=[...new Set(items.map(p=>p.programa).filter(Boolean))];
  document.getElementById('m-sub').textContent=
    total+' emissao'+(total>1?'es':'')+' registrada'+(total>1?'s':'')+
    '  \u00b7  '+progs.length+' programa'+(progs.length>1?'s':'');

  // Agrupar por programa
  const porProg={};
  for(const p of items){
    const pg=p.programa||'Outros';
    if(!porProg[pg])porProg[pg]={eco:Infinity,exec:Infinity,recente:null};
    const pts=p.pontos||0;if(!pts)continue;
    const cab=(p.cabine||'').toLowerCase();
    if(cab.includes('exec')){if(pts<porProg[pg].exec)porProg[pg].exec=pts;}
    else{if(pts<porProg[pg].eco)porProg[pg].eco=pts;}
    if(!porProg[pg].recente||new Date(p.enviadoEm)>new Date(porProg[pg].recente.enviadoEm))
      porProg[pg].recente=p;
  }
  const sorted=Object.entries(porProg).sort((a,b)=>{
    const pa=a[1].eco===Infinity?a[1].exec:a[1].eco;
    const pb=b[1].eco===Infinity?b[1].exec:b[1].eco;
    return pa-pb;
  });

  // Melhor
  const mbox=document.getElementById('m-best');
  if(sorted.length){
    const[bp,bd]=sorted[0];
    const min=bd.eco!==Infinity?bd.eco:bd.exec;
    document.getElementById('m-best-prog').textContent=bp;
    document.getElementById('m-best-prog').style.color=corProg(bp);
    document.getElementById('m-best-pts').textContent='A partir de '+min.toLocaleString('pt-BR')+' pontos';
    mbox.style.display='block';
  }else mbox.style.display='none';

  // Tabela
  const tw=document.getElementById('m-tabela-wrap');
  const ml=document.getElementById('m-linhas');
  if(sorted.length){
    ml.innerHTML=sorted.map(([pg,d])=>{
      const eco=fmtPts(d.eco),exec=fmtPts(d.exec);
      return'<div class="prog-item">'
        +'<span class="dot" style="background:'+corProg(pg)+'"></span>'
        +'<span class="nome">'+pg+'</span>'
        +'<div class="pts-wrap">'
        +(eco?'<span class="pts-eco">'+eco+'</span>':'<span class="pts-na">-</span>')
        +(exec?'<span class="pts-exec">'+exec+'</span>':'<span class="pts-na">-</span>')
        +'</div></div>';
    }).join('');
    tw.style.display='block';
  }else tw.style.display='none';

  // Ultima emissao
  const op=document.getElementById('m-oport');
  const rec=items.filter(p=>p.pontos>0&&p.fonte!=='alerta_rejeitado')
    .sort((a,b)=>new Date(b.enviadoEm||0)-new Date(a.enviadoEm||0))[0];
  if(rec){
    const quando=tempoAtras(rec.enviadoEm);
    document.getElementById('m-oport-badge').textContent=
      '\u26A1 Ultima emissao'+(quando?' \u00b7 '+quando:'');
    document.getElementById('m-oport-rota').textContent=
      (rec.origem||'')+(rec.origem&&rec.destino?' \u2192 ':'')+( rec.destino||'');
    document.getElementById('m-oport-pts').innerHTML=
      rec.pontos.toLocaleString('pt-BR')+
      ' <span>'+(rec.programa||'')+'</span>';
    op.style.display='flex';
  }else op.style.display='none';

  document.getElementById('overlay').classList.add('open');
}
function fecharModal(e){
  if(e&&e.target!==document.getElementById('overlay'))return;
  document.getElementById('overlay').classList.remove('open');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharModal(null);});

/* ── CARREGAR DADOS ──────────────────────────────────────── */
async function carregar(){
  try{
    const ctrl=new AbortController();
    setTimeout(()=>ctrl.abort(),20000);
    const r=await fetch(PROXY+'/passagens/listar?t='+Date.now(),{signal:ctrl.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    passagens=(await r.json()).items||[];
    // Popular filtro de programas
    const sel=document.getElementById('f-prog');
    const progs=[...new Set(passagens.map(p=>p.programa).filter(Boolean))].sort();
    sel.innerHTML='<option value="">Todos os programas</option>'+
      progs.map(p=>'<option value="'+p+'">'+p+'</option>').join('');
    document.getElementById('loading').style.display='none';
    render();
  }catch(e){
    document.getElementById('loading').innerHTML=
      '<span style="color:#ff585e;font-size:13px">Erro: '+e.message+'</span>';
  }
}
carregar();
</script>
